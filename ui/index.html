<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MnM" />
    <title>MnM</title>
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <script>
      (() => {
        const key = "mnm.theme";
        const darkThemeColor = "#2b2822";
        const lightThemeColor = "#fafaf9";
        try {
          const stored = window.localStorage.getItem(key);
          const theme = stored === "light" || stored === "dark" ? stored : "light";
          const isDark = theme === "dark";
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute("content", isDark ? darkThemeColor : lightThemeColor);
          }
        } catch {
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <script>
      /*
       * Tauri developer-preview early error handler.
       *
       * This runs BEFORE any module of the React bundle loads, so it can
       * catch errors thrown during import resolution or vendor module
       * initialization — the kind the React ErrorBoundary cannot reach.
       *
       * If an error fires before `window.__mnmMounted` is set (main.tsx
       * sets it right after createRoot().render() returns), we replace
       * the page with a branded "Backend not detected / developer preview"
       * setup guide that explains exactly what the user needs to do.
       *
       * Web builds: the handler is a no-op unless window.__TAURI_INTERNALS__
       * is defined, so browsers never see this fallback.
       */
      (() => {
        const isTauri =
          typeof window !== "undefined" && "__TAURI_INTERNALS__" in window;
        if (!isTauri) return;

        let rendered = false;
        const render = (message) => {
          if (rendered || window.__mnmMounted) return;
          rendered = true;
          // Hide any loader still running
          try {
            const loader = document.getElementById("app-loader");
            if (loader) loader.style.display = "none";
          } catch {}
          const safe = String(message || "Unknown error").replace(/[<>&]/g, (c) =>
            c === "<" ? "&lt;" : c === ">" ? "&gt;" : "&amp;"
          );
          const html = [
            '<div style="position:fixed;inset:0;z-index:99999;overflow-y:auto;background:#0c0a09;color:#fafaf9;font-family:-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif;">',
            '<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.5rem;padding-top:5rem;">',
            '<div style="max-width:42rem;width:100%;">',
            '<div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:2.5rem;">',
            '<span style="height:1px;width:3rem;background:#44403c;"></span>',
            '<span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.2em;color:#a8a29e;">v0.1.0 — developer preview</span>',
            "</div>",
            '<h1 style="font-family:ui-serif,Georgia,serif;font-size:3rem;font-weight:500;line-height:1.05;letter-spacing:-0.02em;margin:0 0 1.5rem 0;color:#fafaf9;">Backend not detected.</h1>',
            '<p style="font-size:1.125rem;color:#d6d3d1;font-weight:300;line-height:1.6;margin:0 0 2.5rem 0;max-width:36rem;">This build of MnM Desktop is a <strong style="color:#fafaf9;font-weight:500;">developer preview</strong>. It needs a locally running MnM backend to function. Follow the steps below, then click <em>Reload</em>.</p>',
            '<ol style="list-style:none;padding:0;margin:0 0 2rem 0;">',
            renderStep("01", "Clone the repository", "git clone git@github.com:AlphaLuppi/mnm.git"),
            renderStep("02", "Install dependencies", "cd mnm && bun install"),
            renderStep("03", "Start the backend (keep this terminal open)", "bun run dev:server"),
            renderStep("04", "Come back here and click Reload", null),
            "</ol>",
            '<details style="margin:1rem 0;padding:1rem;background:#1c1917;border:1px solid #292524;border-radius:0.375rem;">',
            '<summary style="cursor:pointer;color:#a8a29e;font-size:0.75rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:0.15em;">Error details</summary>',
            '<pre style="margin:0.75rem 0 0 0;font-size:0.75rem;color:#ef4444;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">' + safe + "</pre>",
            "</details>",
            '<div style="display:flex;gap:1rem;margin-top:2rem;padding-top:1.5rem;border-top:1px solid #292524;align-items:center;">',
            '<button type="button" onclick="window.location.reload()" style="padding:1rem 1.75rem;background:#fafaf9;color:#0c0a09;font-size:0.875rem;font-weight:500;letter-spacing:0.025em;border-radius:0.375rem;border:none;cursor:pointer;">Reload and retry</button>',
            '<a href="https://mnm.alphaluppi.fr#download" target="_blank" rel="noopener noreferrer" style="font-size:0.875rem;color:#a8a29e;text-decoration:none;">Read the setup guide ↗</a>',
            "</div>",
            '<p style="margin:4rem 0 0 0;font-size:10px;text-transform:uppercase;letter-spacing:0.2em;color:#57534e;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">MnM — Make No Mistake — Studio Manifeste</p>',
            "</div></div></div>",
          ].join("");
          const host = document.getElementById("root") || document.body;
          host.innerHTML = html;
        };

        function renderStep(n, title, cmd) {
          const cmdBlock = cmd
            ? '<pre style="background:#1c1917;border:1px solid #292524;border-radius:0.375rem;padding:0.75rem 1rem;font-size:0.875rem;color:#d6d3d1;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;margin:0;"><code>' +
              cmd +
              "</code></pre>"
            : "";
          return (
            '<li style="display:flex;gap:1.25rem;margin-bottom:1.25rem;">' +
            '<span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.2em;color:#78716c;padding-top:0.25rem;width:2.5rem;flex-shrink:0;">' +
            n +
            "</span>" +
            '<div style="flex:1;min-width:0;">' +
            '<p style="color:#e7e5e4;margin:0 0 0.5rem 0;">' +
            title +
            "</p>" +
            cmdBlock +
            "</div>" +
            "</li>"
          );
        }

        // Catch synchronous module-load errors and exceptions
        window.addEventListener(
          "error",
          (event) => {
            if (window.__mnmMounted) return;
            const msg =
              (event && (event.message || (event.error && event.error.message))) ||
              "Unknown error";
            render(msg);
          },
          true
        );
        // Catch unhandled promise rejections from async module init
        window.addEventListener("unhandledrejection", (event) => {
          if (window.__mnmMounted) return;
          const msg =
            (event && event.reason && (event.reason.message || event.reason)) ||
            "Unhandled promise rejection";
          render(String(msg));
        });
        // Safety net: if the bundle never mounts within 8s, assume failure
        window.setTimeout(() => {
          if (!window.__mnmMounted) {
            render(
              "The React bundle did not mount within 8 seconds. The packaged DMG may be missing a backend or an asset failed to load."
            );
          }
        }, 8000);
      })();
    </script>
    <style>
      body { margin: 0; padding: 0; }
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        background: #fafaf9;
      }
      .dark #app-loader {
        background: #1c1917;
      }
      #mnm-canvas {
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font: 11px/1 monospace;
        color: #57534e;
        -webkit-user-select: none;
        user-select: none;
      }
      .dark #mnm-canvas {
        color: #a8a29e;
      }
    </style>
  </head>
  <body>
    <div id="app-loader">
      <pre id="mnm-canvas" aria-hidden="true"></pre>
    </div>
    <div id="root"></div>
    <script>
      window.__MNM_LOADER_START = performance.now();
      (() => {
        const LOGO_FULL = [
          "███╗   ███╗       █████╗       ███╗   ███╗",
          "████╗ ████║      ██╔══██╗      ████╗ ████║",
          "██╔████╔██║      ██║  ██║      ██╔████╔██║",
          "██║╚██╔╝██║      ██║  ██║      ██║╚██╔╝██║",
          "██║ ╚═╝ ██║      ██║  ██║      ██║ ╚═╝ ██║",
          "╚═╝     ╚═╝ake   ╚═╝  ╚═╝o     ╚═╝     ╚═╝istake",
        ];
        const LOGO_COMPACT = LOGO_FULL;
        var LOGO = LOGO_FULL;
        var LH = LOGO.length;
        var LW = Math.max(...LOGO.map(l => l.length));
        const NOISE = "░▒▓█▀▄╔╗╚╝║═╭╮╰╯│─";
        const GLYPH = [" ", ".", "·", "▪", "▫", "○"];
        const FPS = 24;
        const FRAME_MS = 1000 / FPS;
        const MIN_DISPLAY = 2200;

        const pre = document.getElementById("mnm-canvas");
        if (!pre) return;

        let dissolving = false;
        let dissolveStart = 0;

        // Called by React (main.tsx) when app is ready
        window.__dismissMnmLoader = () => {
          if (dissolving) return;
          var loader = document.getElementById("app-loader");
          if (!loader) return;
          var elapsed = performance.now() - window.__MNM_LOADER_START;
          var delay = Math.max(0, MIN_DISPLAY - elapsed);
          setTimeout(function() {
            dissolving = true;
            dissolveStart = performance.now();
            // Fallback: if render loop isn't running, just remove it
            setTimeout(function() {
              var el = document.getElementById("app-loader");
              if (el) el.remove();
            }, 2000);
          }, delay);
        };

        function measureChar() {
          const s = document.createElement("span");
          s.textContent = "M";
          s.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font:11px/1 monospace";
          pre.appendChild(s);
          const r = s.getBoundingClientRect();
          pre.removeChild(s);
          return { w: r.width || 7, h: r.height || 11 };
        }

        let cw, ch;
        const m0 = measureChar();
        cw = m0.w; ch = m0.h;

        let cols = 0, rows = 0, lox = 0, loy = 0;
        let logoMap = new Map();
        let tick = 0;
        let lastFrame = 0;
        const startTime = performance.now();
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        function resize() {
          const nc = Math.max(1, Math.floor(pre.clientWidth / cw));
          const nr = Math.max(1, Math.floor(pre.clientHeight / ch));
          if (nc === cols && nr === rows) return;
          cols = nc; rows = nr;
          lox = Math.floor((cols - LW) / 2);
          loy = Math.floor((rows - LH) / 2);
          logoMap = new Map();

          for (let r = 0; r < LH; r++) {
            const line = LOGO[r];
            for (let c = 0; c < line.length; c++) {
              const char = line[c];
              if (char === " ") continue;
              const gr = loy + r;
              const gc = lox + c;
              if (gr < 0 || gr >= rows || gc < 0 || gc >= cols) continue;
              const dx = (c - LW / 2) / LW;
              const dy = (r - LH / 2) / LH;
              const dist = Math.sqrt(dx * dx + dy * dy);
              logoMap.set(gr * cols + gc, {
                ch: char,
                dist: dist,
              });
            }
          }
        }

        function drawStatic() {
          let out = "";
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const lc = logoMap.get(r * cols + c);
              if (lc) { out += lc.ch; }
              else {
                const v = (Math.sin(c * 0.11 + r * 0.04) + Math.cos(r * 0.08 - c * 0.02)) * 0.18 + 0.22;
                out += GLYPH[Math.floor(Math.max(0, Math.min(0.999, v)) * GLYPH.length)];
              }
            }
            if (r < rows - 1) out += "\n";
          }
          pre.textContent = out;
        }

        function render(time) {
          const loader = document.getElementById("app-loader");
          if (!loader) return;
          if (time - lastFrame < FRAME_MS) { requestAnimationFrame(render); return; }

          const dt = lastFrame ? Math.min(3, (time - lastFrame) / 16.667) : 1;
          lastFrame = time;
          tick += dt;
          const elapsed = time - startTime;

          // Dissolve: fade overlay after chars dissolved
          if (dissolving) {
            const dElapsed = time - dissolveStart;
            if (dElapsed > 1100) {
              const fadeP = Math.min(1, (dElapsed - 1100) / 400);
              loader.style.opacity = String(1 - fadeP);
              if (fadeP >= 1) { loader.remove(); return; }
            }
          }

          // Ambient waves
          const colW = new Float32Array(cols);
          const rowW = new Float32Array(rows);
          for (let c = 0; c < cols; c++) colW[c] = Math.sin(c * 0.08 + tick * 0.06);
          for (let r = 0; r < rows; r++) rowW[r] = Math.cos(r * 0.1 - tick * 0.05);

          // Build output
          let out = "";
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const idx = r * cols + c;
              const lc = logoMap.get(idx);

              if (lc) {
                if (dissolving) {
                  // === DISSOLVE: edges first, center last ===
                  const dElapsed = time - dissolveStart;
                  const normDist = Math.min(1, lc.dist / 0.55);
                  const dissolveAt = (1 - normDist) * 700;
                  if (dElapsed < dissolveAt) {
                    out += lc.ch;
                  } else if (dElapsed < dissolveAt + 200) {
                    out += NOISE[Math.floor(Math.random() * NOISE.length)];
                  } else if (dElapsed < dissolveAt + 350) {
                    out += Math.random() < 0.5 ? "·" : " ";
                  } else {
                    out += " ";
                  }
                } else if (Math.random() < 0.002) {
                  // Idle shimmer
                  out += NOISE[Math.floor(Math.random() * NOISE.length)];
                } else {
                  out += lc.ch;
                }
              } else {
                const v = (colW[c] + rowW[r]) * 0.08 + 0.1;
                const clamped = Math.max(0, Math.min(0.999, v * 0.5));
                out += GLYPH[Math.floor(clamped * GLYPH.length)];
              }
            }
            if (r < rows - 1) out += "\n";
          }

          pre.textContent = out;
          requestAnimationFrame(render);
        }

        // ResizeObserver
        new ResizeObserver(() => {
          const m = measureChar();
          cw = m.w; ch = m.h;
          resize();
          if (reducedMotion) drawStatic();
        }).observe(pre);

        resize();
        if (reducedMotion) {
          drawStatic();
        } else {
          requestAnimationFrame(render);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
