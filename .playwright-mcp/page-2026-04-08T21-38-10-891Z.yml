        - generic [ref=e37]: Four pillars
        - heading "Everything an operator needs to see." [level=2] [ref=e38]:
          - text: Everything an operator
          - text: needs to see.
        - paragraph [ref=e39]: MnM exists because AI agents running in production need the same operational rigor as any other critical system — observability, governance, rollback, and audit. Not bolted on. Built in.
      - generic [ref=e40]:
        - article [ref=e41]:
          - generic [ref=e42]:
            - generic [ref=e43]: "01"
            - generic [ref=e44]: Real-time cockpit
          - heading "Supervision" [level=3] [ref=e45]
          - paragraph [ref=e46]: See every agent, every run, every decision — in a single cockpit. Live events via SSE, no polling, no delays. Built for operators who need to know exactly what's happening.
        - article [ref=e47]:
          - generic [ref=e48]:
            - generic [ref=e49]: "02"
            - generic [ref=e50]: Gold, Silver, Bronze
          - heading "Traces" [level=3] [ref=e51]
          - paragraph [ref=e52]: Every agent run is captured in three resolutions. Gold for scored phases and verdicts. Silver for grouped detail. Bronze for raw debug. Auto-generated at completion.
        - article [ref=e53]:
          - generic [ref=e54]:
            - generic [ref=e55]: "03"
            - generic [ref=e56]: Tag-based isolation
          - heading "Governance" [level=3] [ref=e57]
          - paragraph [ref=e58]: Dynamic RBAC, tag-scoped visibility, config layers with priority merge. Users only see what they should. Single tenant, multi-team. Built for compliance from day one.
        - article [ref=e59]:
          - generic [ref=e60]:
            - generic [ref=e61]: "04"
            - generic [ref=e62]: Multi-agent workflows
          - heading "Orchestration" [level=3] [ref=e63]
          - paragraph [ref=e64]: A2A messaging, workflow state machines, HITL validation, compaction snapshots. Chain agents, enforce stages, pause for human review. The whole stack, governed.
