        - generic [ref=e41]: Four pillars
        - heading "Everything an operator needs to see." [level=2] [ref=e42]:
          - text: Everything an operator
          - text: needs to see.
        - paragraph [ref=e43]: MnM exists because AI agents running in production need the same operational rigor as any other critical system — observability, governance, rollback, and audit. Not bolted on. Built in.
      - generic [ref=e44]:
        - article [ref=e45]:
          - generic [ref=e46]:
            - generic [ref=e47]: "01"
            - generic [ref=e48]: Real-time cockpit
          - heading "Supervision" [level=3] [ref=e49]
          - paragraph [ref=e50]: See every agent, every run, every decision — in a single cockpit. Live events via SSE, no polling, no delays. Built for operators who need to know exactly what's happening.
        - article [ref=e51]:
          - generic [ref=e52]:
            - generic [ref=e53]: "02"
            - generic [ref=e54]: Gold, Silver, Bronze
          - heading "Traces" [level=3] [ref=e55]
          - paragraph [ref=e56]: Every agent run is captured in three resolutions. Gold for scored phases and verdicts. Silver for grouped detail. Bronze for raw debug. Auto-generated at completion.
        - article [ref=e57]:
          - generic [ref=e58]:
            - generic [ref=e59]: "03"
            - generic [ref=e60]: Tag-based isolation
          - heading "Governance" [level=3] [ref=e61]
          - paragraph [ref=e62]: Dynamic RBAC, tag-scoped visibility, config layers with priority merge. Users only see what they should. Single tenant, multi-team. Built for compliance from day one.
        - article [ref=e63]:
          - generic [ref=e64]:
            - generic [ref=e65]: "04"
            - generic [ref=e66]: Multi-agent workflows
          - heading "Orchestration" [level=3] [ref=e67]
          - paragraph [ref=e68]: A2A messaging, workflow state machines, HITL validation, compaction snapshots. Chain agents, enforce stages, pause for human review. The whole stack, governed.
