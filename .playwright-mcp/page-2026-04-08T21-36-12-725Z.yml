        - generic [ref=e45]: Four pillars
        - heading "Everything an operator needs to see." [level=2] [ref=e46]:
          - text: Everything an operator
          - text: needs to see.
        - paragraph [ref=e47]: MnM exists because AI agents running in production need the same operational rigor as any other critical system — observability, governance, rollback, and audit. Not bolted on. Built in.
      - generic [ref=e48]:
        - article [ref=e49]:
          - generic [ref=e50]:
            - generic [ref=e51]: "01"
            - generic [ref=e52]: Real-time cockpit
          - heading "Supervision" [level=3] [ref=e53]
          - paragraph [ref=e54]: See every agent, every run, every decision — in a single cockpit. Live events via SSE, no polling, no delays. Built for operators who need to know exactly what's happening.
        - article [ref=e55]:
          - generic [ref=e56]:
            - generic [ref=e57]: "02"
            - generic [ref=e58]: Gold, Silver, Bronze
          - heading "Traces" [level=3] [ref=e59]
          - paragraph [ref=e60]: Every agent run is captured in three resolutions. Gold for scored phases and verdicts. Silver for grouped detail. Bronze for raw debug. Auto-generated at completion.
        - article [ref=e61]:
          - generic [ref=e62]:
            - generic [ref=e63]: "03"
            - generic [ref=e64]: Tag-based isolation
          - heading "Governance" [level=3] [ref=e65]
          - paragraph [ref=e66]: Dynamic RBAC, tag-scoped visibility, config layers with priority merge. Users only see what they should. Single tenant, multi-team. Built for compliance from day one.
        - article [ref=e67]:
          - generic [ref=e68]:
            - generic [ref=e69]: "04"
            - generic [ref=e70]: Multi-agent workflows
          - heading "Orchestration" [level=3] [ref=e71]
          - paragraph [ref=e72]: A2A messaging, workflow state machines, HITL validation, compaction snapshots. Chain agents, enforce stages, pause for human review. The whole stack, governed.
