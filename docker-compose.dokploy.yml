services:
  # Agent sandbox image — built first, used by server to create user containers
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
      cache_from:
        - type=registry,ref=${CI_REGISTRY_IMAGE:-mnm}/agent:buildcache
      cache_to:
        - type=registry,ref=${CI_REGISTRY_IMAGE:-mnm}/agent:buildcache,mode=max
    image: mnm-agent:latest
    deploy:
      replicas: 0  # Never run — just build the image

  # SEC-T10-001: Docker socket proxy — replaces direct /var/run/docker.sock bind-mount.
  # Allowlists only CONTAINERS+IMAGES+NETWORKS for sandbox management. No exec, no build, no swarm.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
      BUILD: 0
      EVENTS: 0
      INFO: 0
      PING: 1
      SWARM: 0
      VOLUMES: 0
      EXEC: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy-net

  server:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
      # BuildKit registry cache — survives runner restarts and shares cache
      # across deploys. Requires DOCKER_BUILDKIT=1 (default in modern docker)
      # and the registry pointed to by CI_REGISTRY_IMAGE to be writable.
      cache_from:
        - type=registry,ref=${CI_REGISTRY_IMAGE:-mnm}/server:buildcache
      cache_to:
        - type=registry,ref=${CI_REGISTRY_IMAGE:-mnm}/server:buildcache,mode=max
    image: ${CI_REGISTRY_IMAGE:-mnm}/server:${APP_VERSION:-latest}
    depends_on:
      agent:
        condition: service_started
      docker-socket-proxy:
        condition: service_started
    expose:
      - ${PORT:-3100}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - PORT=${PORT:-3100}
      - SERVE_UI=true
      - MNM_DEPLOYMENT_MODE=authenticated
      - MNM_DEPLOYMENT_EXPOSURE=private
      - MNM_PUBLIC_URL=${MNM_PUBLIC_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${MNM_PUBLIC_URL}
      - MNM_AGENT_JWT_SECRET=${MNM_AGENT_JWT_SECRET}
      - MNM_MIGRATION_AUTO_APPLY=true
      - MNM_ALLOWED_HOSTNAMES=${MNM_ALLOWED_HOSTNAMES:-localhost}
      - MNM_E2E_SEED=false
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # SEC-T10-001: Use filtered socket proxy instead of raw socket
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mnm-server.rule=Host(`${MNM_DOMAIN:-mnm.localhost}`)"
      - "traefik.http.routers.mnm-server.entrypoints=websecure"
      - "traefik.http.routers.mnm-server.tls.certResolver=letsencrypt"
      - "traefik.http.services.mnm-server.loadbalancer.server.port=${PORT:-3100}"
    volumes:
      - mnm-data:/mnm
    networks:
      - dokploy-network
      - docker-proxy-net

volumes:
  mnm-data:

networks:
  dokploy-network:
    external: true
  docker-proxy-net:
    internal: true  # proxy net is isolated — only server can reach it
