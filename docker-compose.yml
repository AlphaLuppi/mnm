# =============================================================================
# MnM — Docker Compose (Production)
# =============================================================================
# Full production stack: PostgreSQL + Redis + MnM server.
# Redis is internal-only (no exposed port) for security.
#
# Required env vars (set in .env or pass via -e):
#   POSTGRES_PASSWORD    — random password for PostgreSQL (generate: openssl rand -hex 16)
#   BETTER_AUTH_SECRET   — random secret for auth sessions
#   MNM_PUBLIC_URL       — public URL of the MnM instance (optional)
#
# Usage:
#   docker compose up -d
#   docker compose down
# =============================================================================

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: mnm
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (generate: openssl rand -hex 16)}"
      POSTGRES_DB: mnm
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "log_min_duration_statement=1000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnm -d mnm"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    # Port not exposed to host — accessed internally by server via Docker network
    # Uncomment to debug: ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    volumes:
      - redisdata:/data

  # SEC-T10-001: Docker socket proxy — allowlist only the API calls the server needs
  # (container create/start/stop/kill, image pull). Direct socket bind-mount removed.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
      BUILD: 0
      EVENTS: 0
      INFO: 0
      PING: 1
      SWARM: 0
      VOLUMES: 0
      EXEC: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy-net

  server:
    build: .
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: "postgres://mnm:${POSTGRES_PASSWORD}@db:5432/mnm"
      REDIS_URL: redis://redis:6379
      PORT: "3100"
      SERVE_UI: "true"
      MNM_DEPLOYMENT_MODE: "authenticated"
      MNM_DEPLOYMENT_EXPOSURE: "private"
      MNM_PUBLIC_URL: "${MNM_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      MNM_AGENT_JWT_SECRET: "${MNM_AGENT_JWT_SECRET}"
      MNM_SECRETS_KEY: "${MNM_SECRETS_KEY:?MNM_SECRETS_KEY must be set}"
      MNM_MCP_JWT_SECRET: "${MNM_MCP_JWT_SECRET:?MNM_MCP_JWT_SECRET must be set}"
      # GitLab social-link OAuth (optional — provider disabled if any var is missing)
      GITLAB_OAUTH_CLIENT_ID: "${GITLAB_OAUTH_CLIENT_ID:-}"
      GITLAB_OAUTH_CLIENT_SECRET: "${GITLAB_OAUTH_CLIENT_SECRET:-}"
      GITLAB_OAUTH_ISSUER_URL: "${GITLAB_OAUTH_ISSUER_URL:-}"
      BETTER_AUTH_URL: "${MNM_PUBLIC_URL:-http://localhost:3100}"
      MNM_MIGRATION_AUTO_APPLY: "true"
      MNM_E2E_SEED: "${MNM_E2E_SEED:-false}"
      MNM_ALLOWED_HOSTNAMES: "localhost,127.0.0.1"
      # SEC-T10-001: Use filtered socket proxy instead of raw socket
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3100/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - mnm-data:/mnm
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    networks:
      - default
      - docker-proxy-net

volumes:
  pgdata:
  redisdata:
  mnm-data:

networks:
  docker-proxy-net:
    internal: true  # proxy net is isolated — only server can reach it
